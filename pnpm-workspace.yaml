allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ttoss/geovis@0.2.0'

# geovis-workspace 0.5.0 is pinned intentionally: it is the last release that
# still exposes the imperative right-sidebar detail API (shouldOpen /
# onFeatureSelect / renderDetails) and the leftSidebar `menus` field this app
# depends on. That API was removed upstream in ttoss PR #1146 (0.5.2). Its peer
# range asks for geovis ^0.13.0, but it is runtime-compatible with 0.14.x, so
# widen the allowed peer here instead of holding geovis back.
peerDependencyRules:
  allowedVersions:
    '@ttoss/geovis-workspace>@ttoss/geovis': '^0.14.0'
